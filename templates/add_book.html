<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add book · Book Alchemy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <h1>Book Alchemy</h1>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ url_for('index') }}">Library</a>
        <a href="{{ url_for('add_author') }}">Add author</a>
        <a href="{{ url_for('add_book') }}">Add book</a>
    </nav>
</header>

<main class="form-page">
    <section class="panel">
        {% if message %}
        <p class="success">{{ message }}</p>
        <a class="button" href="{{ url_for('add_book') }}">Add another book</a>
        {% else %}
        <h2>Add book</h2>
        <form action="{{ url_for('add_book') }}" method="POST">
            <div class="field">
                <label for="title">Book title</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="field">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" required>
            </div>
            <div class="field">
                <label for="publication_year">Publication year</label>
                <input type="number" id="publication_year" name="publication_year" step="1">
            </div>
            <div class="field">
                <label for="author_id">Author</label>
                <select id="author_id" name="author_id" required>
                    {% for author in authors %}
                    <option value="{{ author.id }}">{{ author.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button class="button" type="submit">Add book</button>
        </form>
        {% endif %}
    </section>
</main>
</body>
</html>
